name: mi5s
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository URL"
        required: true
        default: "https://gitlab.com/msm8996-mainline/linux.git"
      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "msm8996-stable-6.19.y"
      device_code:
        description: "Device codename"
        required: true
        default: "capricorn"
      apply_cjktty_patch:
        description: "Apply CJKTTY 6.19 patches"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      add_firmware:
        description: "Add firmware to the build"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      use_clang:
        description: "Use Clang as the compiler"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      rootfs_url:
        description: "root.zip URL"
        required: true
        default: "https://github.com/pathpass2/xiaomi5s_capricorn/releases/download/ARM64_Ubuntu_RootFS/rootfs.zip"

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo dpkg --add-architecture arm64
          sudo -E apt-get -qq update || true
          sudo -E apt-get -qq install -y binfmt-support qemu-user-static abootimg fakeroot simg2img img2simg mkbootimg android-sdk-libsparse-utils bison flex gcc-aarch64-linux-gnu pkg-config libdw-dev:native libelf-dev libncurses-dev libssl-dev:native libssl-dev:arm64 pahole rsync xz-utils zstd unzip git bc devscripts debhelper openssl patch
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/chroot /workdir /rootfs/tmp_mkboot
          sudo chown $USER:$GROUPS /workdir /rootfs /rootfs/tmp_mkboot /mnt/chroot
          cp *.sh /rootfs/ || true
          cp boot.img /rootfs/ || true
          cp -rf ./firmware /rootfs/ || true

      - name: Download source code
        id: down
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          git clone --depth 1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_repo }}" linux
          ls

      - name: Patch kernel
        id: patch
        run: |
          cp capricorn_defconfig linux/arch/arm64/configs/${{ inputs.device_code }}_defconfig
          cp patch/*.patch ./linux
          chmod +rw linux/arch/arm64/configs/${{ inputs.device_code }}_defconfig
          cd linux
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          make clean
          make mrproper
          git config core.fileMode false
          
          patch -p1 < 0002-capricorn-td4722-panel-support.patch || true
          patch -p1 < 0003-arm64-dts-qcom-capricorn-set-sound-card-model.patch || true
          patch -p1 < 0004-media-venus-hfi_cmds-pack-H264_TRANSFORM_8X8-in-1x.patch || true
          patch -p1 < 0006-arm64-dts-qcom-capricorn-enable-camss-and-front-camera.patch || true
          patch -p1 < 0007-arm64-dts-qcom-capricorn-add-rear-camera-imx378.patch || true
          patch -p1 < 0008-media-i2c-add-imx378-sensor-driver.patch || true
          patch -p1 < 0009-arm64-dts-qcom-capricorn-fix-rpm-regulators-node-name.patch || true
          
          patch -p1 < 0011-ASoC-tfa989x-add-support-for-TFA9891.patch || python3 -c "import re; f='sound/soc/codecs/tfa989x.c'; c=open(f).read(); c=re.sub(r'(#define TFA9890_REVISION\s+0x80)', r'\1\n#define TFA9891_REVISION\t\t0x92', c); c=re.sub(r'(static const struct tfa989x_rev tfa9890_rev = \{.*?\n\};)', r'\1\n\n/* TFA9891 compatible */\nstatic const struct tfa989x_rev tfa9891_rev = {\n\t.rev\t= TFA9891_REVISION,\n\t.init\t= tfa9890_init,\n};\n', c, flags=re.DOTALL); c=c.replace('{ .compatible = \"nxp,tfa9890\", .data = &tfa9890_rev },', '{ .compatible = \"nxp,tfa9890\", .data = &tfa9890_rev },\n\t{ .compatible = \"nxp,tfa9891\", .data = &tfa9891_rev },'); open(f,'w').write(c)"
          
          patch -p1 < 0012-ASoC-qcom-apq8096-add-MI2S-clock-and-format-setup.patch || true
          patch -p1 < 0013-arm64-dts-qcom-capricorn-add-tfa9891-speaker.patch || true
          
          awk '!/^dtb-\$\(CONFIG_ARCH_QCOM\).*+=/ || /msm8996pro-xiaomi-capricorn-td4722\.dtb/' arch/arm64/boot/dts/qcom/Makefile > arch/arm64/boot/dts/qcom/Makefile.capricorn
          mv arch/arm64/boot/dts/qcom/Makefile.capricorn arch/arm64/boot/dts/qcom/Makefile
          
          if [ "${{ inputs.apply_cjktty_patch }}" == "true" ]; then
            patch -p1 < cjktty-6.19.patch || true
            patch -p1 < cjktty-add-cjk32x32-font-data.patch || true
          fi
          
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply patches" || true
          cd ..

      - name: Compile
        id: compile
        run: |
          cd linux
          export PATH=/usr/lib/llvm-19/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export ARCH=arm64
          export KDEB_OPTIONS="-d"
          
          unset LOCALVERSION || true
          unset CONFIG_LOCALVERSION || true

          sed -i 's|echo "+"|echo ""|g' scripts/setlocalversion
          sed -i 's|printf "+"|true|g' scripts/setlocalversion
          
          if [ "${{ inputs.use_clang }}" == "true" ]; then
            make ${{ inputs.device_code }}_defconfig ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang-19 LD=ld.lld-19 AR=llvm-ar AS=llvm-as NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1
            make bindeb-pkg KDEB_OPTIONS="-d" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang-19 LD=ld.lld-19 AR=llvm-ar AS=llvm-as NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1 KCFLAGS="-mcpu=kryo" -j$(nproc)
          else
            make ${{ inputs.device_code }}_defconfig
            make bindeb-pkg KDEB_OPTIONS="-d" -j$(nproc)
          fi
          
          cd ..
          cp *.deb /workdir
          cp *.deb /rootfs
          
          # 获取内核版本号
          KVER=$(cat linux/include/config/kernel.release)
          echo "Kernel version: $KVER"
          
          # ==========================================
          # 制作真实的 linux-headers 文件夹并打包
          # ==========================================
          mkdir -p /workdir/linux-headers-$KVER
          cp -a linux/Module.symvers /workdir/linux-headers-$KVER/
          cp -a linux/Makefile       /workdir/linux-headers-$KVER/
          cp -a linux/scripts        /workdir/linux-headers-$KVER/
          
          mkdir -p /workdir/linux-headers-$KVER/arch/arm64
          cp -a linux/arch/arm64/include /workdir/linux-headers-$KVER/arch/arm64/
          cp -a linux/arch/arm64/kvm     /workdir/linux-headers-$KVER/arch/arm64/
          cp -a linux/arch/arm64/Makefile /workdir/linux-headers-$KVER/arch/arm64/
          
          cp -a linux/include /workdir/linux-headers-$KVER/
          cp -a linux/.config /workdir/linux-headers-$KVER/
          
          # 进入 workdir 打包头文件，并删除临时文件夹
          cd /workdir
          tar -zcf linux-headers-kernel_version-$KVER.tar.gz linux-headers-$KVER
          rm -rf linux-headers-$KVER
          
          # ==========================================
          # 打包完毕后，显式切回 GitHub Workspace，确保后续路径正确
          # ==========================================
          cd $GITHUB_WORKSPACE
          
          cp linux/arch/arm64/boot/Image.gz /workdir
          cp linux/arch/arm64/boot/Image.gz /rootfs/tmp_mkboot/
          cp linux/arch/arm64/boot/dts/qcom/msm8996pro-xiaomi-capricorn-td4722.dtb /rootfs/tmp_mkboot/
          tar -czf /workdir/dtb.tar.gz linux/arch/arm64/boot/dts/qcom/msm8996pro-xiaomi-capricorn-td4722.dtb
          find linux/ -type f \( ! -name "*.ko" -a ! -name "modules.*" \) -exec rm -f {} \; 
          cd linux/
          tar -czf /workdir/modules.tar.gz ./*
          cd ..
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Prepare Environment
        run: |
          cd /rootfs
          wget -O root.zip "${{ inputs.rootfs_url }}"
          unzip root.zip
          sudo rm -rf root.zip
          simg2img ./rootfs.img ./root.img
          sudo rm -rf rootfs.img
          sudo mount root.img /mnt/chroot
          sudo mount --bind /proc /mnt/chroot/proc
          sudo mount --bind /dev /mnt/chroot/dev
          sudo mount --bind /dev/pts /mnt/chroot/dev/pts
          sudo mount --bind /sys /mnt/chroot/sys
          sudo cp /etc/resolv.conf /mnt/chroot/etc/resolv.conf || true
          sudo rm -rf /mnt/chroot/tmp/linux-*.deb
          cp linux-* /mnt/chroot/tmp
          if [ "${{ inputs.add_firmware }}" == "true" ]; then
            sudo cp -rf --no-dereference ./firmware/* /mnt/chroot/lib/firmware/ || true
          fi

      - name: Install Kernel in chroot
        run: |
          sudo chroot /mnt/chroot /bin/bash -c "
            cd /tmp
            # 卸载旧内核包
            pkgs=\$(dpkg -l | grep -E 'linux-headers|linux-image' | awk '{print \$2}' || true)
            if [ -n \"\$pkgs\" ]; then dpkg -P \$pkgs; fi
            
            # 删除旧模块
            rm -rf /lib/modules/*
            
            # 更新源并安装基础依赖
            apt-get update || true
            apt-get install -y --no-install-recommends linux-base initramfs-tools || true
            
            # 1. 先单独装 libc-dev 和 image
            dpkg -i linux-libc-dev-*.deb || true
            dpkg -i linux-image-*.deb || true
            dpkg --configure -a || true
            
            # 2. 再安装 headers
            dpkg -i linux-headers-*.deb || true
            dpkg --configure -a || true
            
            # 3. 如果自动生成 initrd 失败，强制手动生成一次
            if [ ! -f /boot/initrd.img-* ]; then
              echo '自动生成 initrd 失败，手动生成...'
              update-initramfs -c -k all || true
            fi
            
            echo '--- 检查 initrd 和 headers ---'
            ls -l /boot/initrd.img-* || true
            ls -l /usr/src/
          "

      - name: Build boot image
        run: |
          cd /rootfs/
          cp /mnt/chroot/boot/initrd* ./tmp_mkboot/
          cp ./tmp_mkboot/initrd* ./tmp_mkboot/initrd.img
          cat ./tmp_mkboot/Image.gz ./tmp_mkboot/msm8996pro-xiaomi-capricorn-td4722.dtb > ./tmp_mkboot/kernel-dtb
          UUID=$(blkid ./root.img | sed -n 's/.*UUID="\([^"]*\)".*/\1/p')
          abootimg -x boot.img
          sed -i "s|^cmdline = .*|cmdline = console=tty0 root=UUID=$UUID rw loglevel=3 splash cpuidle.governor=teo|" bootimg.cfg
          OUTPUT_PATH="/workdir/boot.img"
          cp ./tmp_mkboot/initrd.img initrd.img
          cp ./tmp_mkboot/kernel-dtb zImage
          KERNEL_SIZE=$(stat -c %s zImage)
          RAMDISK_SIZE=$(stat -c %s initrd.img)
          PAGESIZE=4096
          ALIGN=$((PAGESIZE - 1))
          CALC_SIZE=$((KERNEL_SIZE + RAMDISK_SIZE + 2 * PAGESIZE))
          BOOTSIZE=$(((CALC_SIZE + ALIGN) & ~ALIGN))
          BOOTSIZE_WITH_EXTRA=$((BOOTSIZE + 1048576))
          sed -i "s|^bootsize = .*|bootsize = 0x$(printf '%x' $BOOTSIZE_WITH_EXTRA)|" bootimg.cfg
          abootimg --create "$OUTPUT_PATH" -f bootimg.cfg -k zImage -r initrd.img
          img2simg ./root.img ./rootfs.img
          
          # 不再压缩 root.zip，直接复制 rootfs.img 到产物目录
          cp ./rootfs.img /workdir/

      - name: Set release tag
        id: release_tag
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          echo "tag=ubuntu22.04_for_${{ inputs.device_code }}_$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload image to Release
        uses: ncipollo/release-action@main
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          artifacts: /workdir/*
          allowUpdates: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            This is boot.img and rootfs.img for ${{ inputs.device_code }}
            Base rootfs: Ubuntu 22.04 (jammy) — ${{ inputs.rootfs_url }}
